spring:
  application:
    name: audit-service

  datasource:
    url: jdbc:postgresql://localhost:5436/auditdb
    username: juribook
    password: juribook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085

# ═══════════════════════════════════════════════════════════
#  JWT : Même secret que les autres services métier.
#  audit-service ne génère pas de JWT, il valide uniquement les
#  tokens émis par l'auth-service. GET /api/audit exige un rôle ADMIN.
# ═══════════════════════════════════════════════════════════
jwt:
  secret: juribook-secret-key-must-be-at-least-256-bits-long-for-hs256

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  show-actuator: false