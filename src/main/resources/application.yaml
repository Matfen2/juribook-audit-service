spring:
  application:
    name: audit-service

  # ═══════════════════════════════════════════════════════════
  #  Port 5436 en local, voir docker-compose.yml (postgres-audit)
  #  En conteneur Docker, surchargé par SPRING_DATASOURCE_URL
  # ═══════════════════════════════════════════════════════════
  datasource:
    url: jdbc:postgresql://localhost:5436/auditdb
    username: juribook
    password: juribook
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true

  # ═══════════════════════════════════════════════════════════
  #  Kafka : jamais désactivé, comme notification-service, c'est
  #  la raison d'être de ce service. Sans broker disponible en
  #  local, l'app démarre quand même (retente en arrière-plan).
  # ═══════════════════════════════════════════════════════════
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: audit-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8085